name: Mobile Release

# Tag-triggered release pipeline — separate from mobile-ci.yml (push-to-main
# + PR checks) so a v* tag push can't be blocked by, or regress, that
# pipeline. Builds an Android release APK and uploads it as a workflow
# artifact; does not sign it for distribution (android/app/build.gradle.kts
# still signs the release build type with the debug keystore — a
# pre-existing TODO, not something this workflow changes).

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-release-apk:
    name: Build & upload release APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rahati-release-apk-${{ github.ref_name }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
