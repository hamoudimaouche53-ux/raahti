name: rahati-osrm

# Production-oriented OSRM (walking/foot profile) routing service for RAHATI.
# See README.md for architecture, data pipeline, and operations. RAHATI's
# backend never talks to this compose project directly by name — it only
# ever reads OSRM_BASE_URL (apps/backend/.env / .env.example), so pointing
# the backend at this service is a configuration change, never a code change.
#
# Everything here is deliberately dependency-free beyond Docker + the pinned
# official OSRM image — no extra build step, no custom Dockerfile, so the
# routing engine itself is exactly what the OSRM project ships.

services:
  osrm:
    # Pinned, never `latest` — see README.md "OSRM version" for why v5.27.1
    # was chosen. Official image, published by the OSRM project itself.
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: rahati-osrm
    restart: unless-stopped

    # MLD (multi-level Dijkstra) is the algorithm this compose project's
    # preprocessing pipeline (scripts/preprocess.sh) produces data for —
    # required to match here, `osrm-routed` fails fast otherwise.
    #
    # No --max-table-size override: RAHATI only ever calls /route/v1/foot/
    # (never /table/), so the default is irrelevant to us either way — and
    # in testing, a low explicit value (e.g. 1) made osrm-routed v5.27.1
    # exit immediately with no log output at all (likely an internal
    # assertion on the argument value), so it is deliberately left at its
    # built-in default rather than tuned.
    command: >
      osrm-routed --algorithm mld
      /data/current/${OSRM_REGION:-algeria}-latest.osrm

    volumes:
      # Only the *processed* dataset is mounted, and read-only: this
      # container only ever serves routes, it never preprocesses (that's
      # scripts/preprocess.sh, run via `docker compose run`, see README.md).
      # ${OSRM_DATA_DIR} defaults to ./data (this directory), never committed
      # to git (see repo-root .gitignore) — override in infra/osrm/.env for
      # a real server-managed data volume/path in production.
      - ${OSRM_DATA_DIR:-./data}/current:/data/current:ro

    ports:
      # Bound to loopback only by default — this is an internal dependency
      # of the RAHATI backend, never a public endpoint (see README.md
      # "Security"). ${OSRM_HOST_PORT} is configurable; the container's own
      # internal port is always OSRM's default, 5000.
      - "${OSRM_BIND_ADDRESS:-127.0.0.1}:${OSRM_HOST_PORT:-5000}:5000"

    healthcheck:
      # "Container is running" is not sufficient (task requirement) — this
      # performs an actual /route/v1/foot/ request for a short, known-good
      # Algiers route and greps for a real route in the response, using only
      # bash's built-in /dev/tcp (the official image has bash but no
      # curl/wget — see README.md "Health check" for the full rationale and
      # scripts/healthcheck.sh for the standalone, human-runnable version of
      # the same check).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /route/v1/foot/3.05,36.73;3.06,36.74?overview=false HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"code\":\"Ok\"' <&3",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
